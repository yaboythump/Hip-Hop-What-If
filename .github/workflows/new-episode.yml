name: Hip Hop What If - New Episode

on:
  workflow_dispatch:
    inputs:
      episode_topic:
        description: "What episode do you want to create?"
        required: true
        default: "What If Jay-Z Signed Everybody To Roc-A-Fella?"
        type: string
      video_url:
        description: "Paste the Higgsfield final MP4 download URL here"
        required: true
        type: string
      thumbnail_url:
        description: "Optional thumbnail image URL"
        required: false
        default: ""
        type: string
      upload_privacy:
        description: "YouTube upload privacy"
        required: true
        default: "private"
        type: choice
        options:
          - private
          - unlisted
          - public

jobs:
  new_episode:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      EPISODE_TOPIC: ${{ github.event.inputs.episode_topic }}
      VIDEO_URL: ${{ github.event.inputs.video_url }}
      THUMBNAIL_URL: ${{ github.event.inputs.thumbnail_url }}
      UPLOAD_PRIVACY: ${{ github.event.inputs.upload_privacy }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build episode package
        run: |
          mkdir -p output
          python scripts/new_episode.py \
            --episode-topic "$EPISODE_TOPIC" \
            --upload-privacy "$UPLOAD_PRIVACY"

      - name: Find episode folder
        id: episode
        shell: bash
        run: |
          EPISODE_DIR="$(find output -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          if [[ -z "$EPISODE_DIR" ]]; then
            echo "::error::No episode folder was created under output/"
            exit 1
          fi
          if [[ ! -f "$EPISODE_DIR/episode-package.json" ]]; then
            echo "::error::Missing episode package: $EPISODE_DIR/episode-package.json"
            exit 1
          fi
          echo "episode_dir=$EPISODE_DIR" >> "$GITHUB_OUTPUT"
          echo "Found episode folder: $EPISODE_DIR"

      - name: Download Higgsfield final video
        shell: bash
        run: |
          if [[ -z "$VIDEO_URL" ]]; then
            echo "::error::Missing Higgsfield video URL"
            exit 1
          fi

          EPISODE_DIR="${{ steps.episode.outputs.episode_dir }}"

          echo "Downloading Higgsfield video..."
          curl -L --fail --retry 3 --retry-delay 5 \
            "$VIDEO_URL" \
            -o "$EPISODE_DIR/final.mp4"

          if [[ ! -s "$EPISODE_DIR/final.mp4" ]]; then
            echo "::error::Downloaded final.mp4 is missing or empty"
            exit 1
          fi

          echo "Downloaded final video to $EPISODE_DIR/final.mp4"

      - name: Download thumbnail if provided
        shell: bash
        run: |
          EPISODE_DIR="${{ steps.episode.outputs.episode_dir }}"

          if [[ -z "$THUMBNAIL_URL" ]]; then
            echo "No thumbnail URL provided. Skipping thumbnail download."
            exit 0
          fi

          echo "Downloading thumbnail..."
          curl -L --fail --retry 3 --retry-delay 5 \
            "$THUMBNAIL_URL" \
            -o "$EPISODE_DIR/thumbnail.png"

          echo "Downloaded thumbnail to $EPISODE_DIR/thumbnail.png"

      - name: Upload private episode to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python scripts/upload_youtube.py \
            --episode-dir "${{ steps.episode.outputs.episode_dir }}" \
            --privacy "$UPLOAD_PRIVACY"

      - name: Keep episode package
        uses: actions/upload-artifact@v4
        with:
          name: hip-hop-what-if-upload-package
          retention-days: 14
          path: |
            output/**
