name: Hip Hop What If - New Episode

on:
  workflow_dispatch:
    inputs:
      episode_topic:
        description: "What episode do you want to create?"
        required: true
        type: string
      upload_privacy:
        description: "YouTube upload privacy for testing"
        required: true
        default: "private"
        type: choice
        options:
          - private
          - unlisted
          - public

jobs:
  new_episode:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      EPISODE_TOPIC: ${{ github.event.inputs.episode_topic }}
      UPLOAD_PRIVACY: ${{ github.event.inputs.upload_privacy }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build test episode package
        run: |
          mkdir -p output
          python scripts/new_episode.py \
            --episode-topic "$EPISODE_TOPIC" \
            --upload-privacy "$UPLOAD_PRIVACY"

      - name: Find episode folder
        id: episode
        shell: bash
        run: |
          EPISODE_DIR="$(find output -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          echo "episode_dir=$EPISODE_DIR" >> "$GITHUB_OUTPUT"
          echo "Found episode folder: $EPISODE_DIR"

      - name: Validate YouTube upload package
        run: |
          python scripts/upload_youtube.py \
            --episode-dir "${{ steps.episode.outputs.episode_dir }}" \
            --privacy "$UPLOAD_PRIVACY" \
            --dry-run

      - name: Keep episode package
        uses: actions/upload-artifact@v4
        with:
          name: hip-hop-what-if-test-package
          retention-days: 14
          path: |
            output/**
